<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCart - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body.auth-page-bg { height: auto !important; min-height: 100vh; overflow-y: auto !important; padding-bottom: 50px; }
        .admin-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 25px; border-radius: 15px; margin-bottom: 25px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; max-width: 1300px; margin: 40px auto; padding: 0 20px;}
        .admin-panel h3 { border-bottom: 2px dashed #bdc3c7; padding-bottom: 10px; margin-top: 0; color: #2c3e50; font-size: 1.3rem;}
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden;}
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid #ecf0f1; font-size: 0.95rem; }
        th { background-color: #3498db; color: white; font-weight: 600;}
        tr:hover { background-color: #f8f9fa; }
        .action-btn { cursor: pointer; border: none; background: none; font-size: 1.1rem; transition: transform 0.2s;}
        .action-btn:hover { transform: scale(1.2); }
        .edit-btn { color: #f39c12; margin-right: 15px; }
        .delete-btn { color: #e74c3c; }
        .scrollable-list { overflow-y: auto; padding-right: 10px;}
        #edit-alert { display: none; background: #f39c12; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body class="auth-page-bg"> 
    <nav class="navbar">
        <div class="logo">MediCart <span>Admin</span></div>
        <div class="nav-user">
            <a href="home.html" style="color: white; margin-right: 20px; font-weight: bold; text-decoration: none;"><i class="fas fa-store"></i> View Shop</a>
            <a href="#" class="logout-btn" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div id="toast-container"></div>

    <div class="admin-grid fade-in-up">
        
        <div class="admin-panel" style="height: fit-content;">
            <h3><i class="fas fa-plus-circle" style="color: #3498db; margin-right: 8px;"></i> <span id="form-title">Add New Medicine</span></h3>
            <div id="edit-alert"><i class="fas fa-pen"></i> Editing Mode Active</div>

            <form id="add-product-form">
                <input type="hidden" id="edit-id">

                <div class="form-group icon-input">
                    <i class="fas fa-pills"></i>
                    <input type="text" id="p-name" class="form-input" required placeholder="Medicine Name">
                </div>
                <div class="form-group icon-input">
                    <i class="fas fa-rupee-sign"></i>
                    <input type="number" id="p-price" class="form-input" required placeholder="Price">
                </div>
                
                <div class="form-group icon-input">
                    <i class="fas fa-boxes"></i>
                    <input type="number" id="p-stock" class="form-input" required placeholder="Stock Quantity">
                </div>

                <div class="form-group icon-input">
                    <i class="fas fa-tags"></i>
                    <select id="p-category" class="form-input category-select" title="Select a category">
                        <option value="General">General</option>
                        <option value="Pain Relief">Pain Relief</option>
                        <option value="Supplements">Supplements</option>
                        <option value="Syrup">Syrup</option>
                        <option value="Diabetes">Diabetes</option>
                        <option value="Safety">Safety</option>
                    </select>
                </div>
                <div class="form-group icon-input">
                    <i class="fas fa-image"></i>
                    <input type="text" id="p-image" class="form-input" placeholder="Image URL (e.g. https://...)" required>
                </div>
                
                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="p-rx" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="p-rx" style="margin: 0; color: #e74c3c; font-weight: bold; cursor: pointer;">⚕️ Requires Prescription</label>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="submit-btn" class="auth-btn glow-btn" style="flex: 2;">Add Product</button>
                    <button type="button" id="cancel-btn" class="auth-btn" style="flex: 1; background: #95a5a6; display: none;" onclick="cancelEdit()">Cancel</button>
                </div>
            </form>
        </div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
           
           <div class="admin-panel">
                <h3><i class="fas fa-box" style="color: #27ae60; margin-right: 8px;"></i> Manage Customer Orders</h3>
                <div class="scrollable-list" id="admin-orders-container" style="max-height: 350px;">
                    <p>Loading orders...</p>
                </div>
            </div>

            <div class="admin-panel">
                <h3><i class="fas fa-box-open" style="color: #8e44ad; margin-right: 8px;"></i> Manage Medicines Inventory</h3>
                <div class="scrollable-list" id="admin-product-list" style="max-height: 400px;">
                    <p>Loading products...</p>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.isAdmin !== true) {
            window.location.replace('admin-login.html');
        }
        // --- 1. LOAD ORDERS ---
        async function loadAdminOrders() {
            const container = document.getElementById('admin-orders-container');
            try {
                const response = await fetch('/api/orders/all');
                const orders = await response.json();
                
                if (orders.length === 0) {
                    container.innerHTML = '<p style="color: #7f8c8d; text-align: center; margin-top: 20px;">No orders have been placed yet.</p>';
                    return;
                }

                let html = `
                    <table style="width:100%; text-align:left; border-collapse: collapse; margin-top: 10px;">
                        <tr style="background:#f1f2f6; border-bottom: 2px solid #bdc3c7;">
                            <th style="padding:12px;">Customer</th>
                            <th style="padding:12px;">Amount</th>
                            <th style="padding:12px;">Current Status</th>
                            <th style="padding:12px;">Update</th>
                        </tr>
                `;
                
                orders.forEach(order => {
                    let statusColor = "#f39c12"; 
                    if(order.status === "Shipped") statusColor = "#3498db"; 
                    if(order.status === "Delivered") statusColor = "#27ae60"; 

                    html += `
                        <tr style="border-bottom: 1px solid #ecf0f1;">
                            <td style="padding:12px;"><strong>${order.shippingAddress.fullName}</strong></td>
                            <td style="padding:12px; font-weight: bold; color: #2c3e50;">₹${order.totalAmount}</td>
                            <td style="padding:12px; font-weight: bold; color: ${statusColor};">${order.status}</td>
                            <td style="padding:12px;">
                                <select onchange="updateOrderStatus('${order._id}', this.value)" style="padding:6px; border-radius: 5px; border: 1px solid #bdc3c7; cursor: pointer; outline: none;">
                                    <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                    <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
                html += '</table>';
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color:#e74c3c;">Error loading orders.</p>';
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                const response = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if(response.ok) {
                    showToast(`Order updated to: ${newStatus}`, "success");
                    loadAdminOrders(); 
                }
            } catch (err) {
                showToast('Failed to update status', "error");
            }
        }

        // --- 2. LOAD PRODUCTS ---
        async function loadAdminProducts() {
            const container = document.getElementById('admin-product-list');
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                container.innerHTML = '';
                
                if(products.length === 0) {
                    container.innerHTML = '<p style="color: #7f8c8d; text-align: center;">No products in inventory.</p>';
                    return;
                }

                products.forEach(p => {
                    const rxBadge = p.requiresRx ? '<span style="color:#e74c3c; font-size:0.7rem; font-weight:bold; margin-left:5px;">⚕️ Rx</span>' : '';
                    const currentStock = p.stock || 0; 
                    const stockDisplay = currentStock > 0 ? `<span style="color:#27ae60;">In Stock: ${currentStock}</span>` : `<span style="color:#e74c3c;">Out of Stock</span>`;

                    const item = `
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ecf0f1; padding: 15px 0;">
                            <div style="display:flex; align-items:center; gap:15px;">
                                <div style="background:white; padding:5px; border-radius:8px; border:1px solid #eee;">
                                    <img src="${p.image}" width="50" height="50" style="object-fit:contain;">
                                </div>
                                <div>
                                    <strong style="color:#2c3e50; font-size:1.05rem;">${p.name} ${rxBadge}</strong><br>
                                    <small style="color:#7f8c8d; font-weight:bold;">₹${p.price} &nbsp;|&nbsp; ${stockDisplay}</small>
                                </div>
                            </div>
                            <div>
                                <button class="action-btn edit-btn" title="Edit Product" onclick="editProduct('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, '${p.category}', '${p.image}', ${p.requiresRx}, ${currentStock})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="action-btn delete-btn" title="Delete Product" onclick="deleteProduct('${p._id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += item;
                });
            } catch (err) { console.error(err); }
        }

        // --- 3. HANDLE PRODUCT ADD/EDIT/DELETE ---
        function editProduct(id, name, price, category, image, requiresRx, stock) {
            document.getElementById('edit-id').value = id;
            document.getElementById('p-name').value = name;
            document.getElementById('p-price').value = price;
            document.getElementById('p-category').value = category;
            document.getElementById('p-image').value = image;
            document.getElementById('p-rx').checked = requiresRx;
            document.getElementById('p-stock').value = stock;

            document.getElementById('form-title').innerText = "Edit Medicine";
            document.getElementById('submit-btn').innerText = "Update Product";
            document.getElementById('submit-btn').style.background = "linear-gradient(135deg, #f39c12, #e67e22)";
            document.getElementById('cancel-btn').style.display = "block";
            document.getElementById('edit-alert').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('add-product-form').reset();
            document.getElementById('edit-id').value = "";
            document.getElementById('form-title').innerText = "Add New Medicine";
            document.getElementById('submit-btn').innerText = "Add Product";
            document.getElementById('submit-btn').style.background = "linear-gradient(135deg, #3498db, #2980b9)";
            document.getElementById('cancel-btn').style.display = "none";
            document.getElementById('edit-alert').style.display = "none";
        }

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            
            const productData = {
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value), 
                category: document.getElementById('p-category').value,
                image: document.getElementById('p-image').value,
                requiresRx: document.getElementById('p-rx').checked,
                stock: parseInt(document.getElementById('p-stock').value) || 0 
            };

            try {
                let res;
                if (editId) {
                    res = await fetch(`/api/products/${editId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(productData) });
                } else {
                    res = await fetch('/api/products/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(productData) });
                }
                
                if (res.ok) {
                    showToast(editId ? "Product Updated Successfully!" : "Product Added!", "success");
                    cancelEdit(); 
                    loadAdminProducts(); 
                } else {
                    const errorData = await res.json();
                    showToast("Error: " + (errorData.message || "Failed to update"), "error");
                }
            } catch (err) { showToast("Server Connection Error", "error"); }
        });

        async function deleteProduct(id) {
            if(!confirm("Permanently delete this product?")) return;
            try {
                await fetch(`/api/products/${id}`, { method: 'DELETE' });
                showToast("Product deleted", "info");
                loadAdminProducts();
            } catch (err) { showToast("Error deleting product", "error"); }
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // Initialize both panels
        loadAdminOrders();
        loadAdminProducts();
    </script>
</body>
</html>
